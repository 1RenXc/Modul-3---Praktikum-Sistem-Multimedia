<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Modul 2</title>
    <script>
        function playPause() {
            var myVideo = document.getElementById("video1");
            if (myVideo.paused) myVideo.play();
            else myVideo.pause();
        }

        function makeBig() { document.getElementById("video1").width = 560; }
        function makeSmall() { document.getElementById("video1").width = 320; }
        function makeNormal() { document.getElementById("video1").width = 420; }

        function getLocation() {
            var x = document.getElementById("demo");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    x.innerHTML = "Latitude: " + position.coords.latitude + "<br>Longitude: " + position.coords.longitude;
                });
            } else {
                x.innerHTML = "Geolocation tidak didukung browser ini.";
            }
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));
        }
    </script>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f6f7ff 0%, #eef7ff 100%); color: #1f2937;">
    <div style="max-width: 980px; margin: 40px auto; background: rgba(255, 255, 255, 0.9); border: 1px solid #e5e7eb; border-radius: 20px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08); padding: 28px 30px;">
        <header style="text-align: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 2px solid #dbeafe;">
            <h1 style="margin: 0; color: #1e3a8a; font-size: 2rem;">Dearen Otniel Kansil</h1>
            <p style="margin: 8px 0 0; font-size: 1.1rem; color: #475569; font-weight: 600;">NIM: 240211060084</p>
        </header>

        <h2 style="margin: 22px 0 14px; color: #1d4ed8; font-size: 1.5rem;">1. Audio</h2>
        <audio controls style="width: 100%; max-width: 500px; background: #f3f4f6; border-radius: 12px; padding: 8px;">
            <source src="https://videotourl.com/audio/1790174575221-e1b9bf57-a700-4a45-815c-af8154f6c17d.mp3" type="audio/ogg">
            <source src="lagu.mp3" type="audio/mpeg">
        </audio>

        <h2 style="margin: 30px 0 14px; color: #1d4ed8; font-size: 1.5rem;">2. Video &amp; JS Control</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;">
            <button onclick="playPause()" style="padding: 10px 16px; border: none; background: #2563eb; color: white; border-radius: 10px; cursor: pointer; font-weight: 600; box-shadow: 0 6px 14px rgba(37, 99, 235, 0.2);">Play/Pause</button>
            <button onclick="makeBig()" style="padding: 10px 16px; border: none; background: #14b8a6; color: white; border-radius: 10px; cursor: pointer; font-weight: 600;">Big</button>
            <button onclick="makeSmall()" style="padding: 10px 16px; border: none; background: #f59e0b; color: white; border-radius: 10px; cursor: pointer; font-weight: 600;">Small</button>
            <button onclick="makeNormal()" style="padding: 10px 16px; border: none; background: #6b7280; color: white; border-radius: 10px; cursor: pointer; font-weight: 600;">Normal</button>
        </div>

        <video id="video1" width="420" style="max-width: 100%; border-radius: 16px; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.15); background: #111827;">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            <source src="mov_bbb.ogg" type="video/ogg">
        </video>

        <h2 style="margin: 30px 0 14px; color: #1d4ed8; font-size: 1.5rem;">3. YouTube Embed</h2>
        <iframe
            width="420"
            height="315"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=wxOXy5OOCJFgIEm3"
            style="max-width: 100%; border: 0; border-radius: 16px; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

        <h2 style="margin: 30px 0 14px; color: #1d4ed8; font-size: 1.5rem;">4. Geolocation API</h2>
        <button onclick="getLocation()" style="padding: 10px 18px; border: none; background: #8b5cf6; color: white; border-radius: 10px; cursor: pointer; font-weight: 600; margin-bottom: 12px;">Cek Lokasi</button>
        <p id="demo" style="min-height: 44px; margin: 0; padding: 12px 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; color: #374151;">Klik tombol untuk melihat lokasi Anda.</p>

        <h2 style="margin: 30px 0 14px; color: #1d4ed8; font-size: 1.5rem;">5. Drag and Drop API</h2>
        <div style="display: flex; gap: 18px; flex-wrap: wrap;">
            <div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)" style="float: left; width: 120px; height: 70px; padding: 12px; border: 2px dashed #60a5fa; border-radius: 14px; background: linear-gradient(135deg, #eff6ff, #dbeafe); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(96,165,250,0.2);">
                <img src="https://www.w3schools.com/html/img_w3slogo.gif" draggable="true" ondragstart="drag(event)" id="drag1" width="88" height="31" style="display: block; border-radius: 8px; background: white;">
            </div>

            <div id="div2" ondrop="drop(event)" ondragover="allowDrop(event)" style="float: left; width: 140px; height: 70px; padding: 12px; border: 2px dashed #94a3b8; border-radius: 14px; background: linear-gradient(135deg, #f8fafc, #e2e8f0); display: flex; align-items: center; justify-content: center;">
            </div>
        </div>

        <footer style="margin-top: 32px; padding-top: 18px; border-top: 2px solid #dbeafe; text-align: center; color: #1f2937; background: linear-gradient(135deg, #eff6ff, #f8fafc); border-radius: 12px; padding: 16px 20px; font-weight: 700;">
            Nama: Dearen Otniel Kansil<br>
            NIM: 240211060084
        </footer>
    </div>
</body>
</html>
